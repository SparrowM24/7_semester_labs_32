x-provider: &provider
  build: {context: ., dockerfile: provider/Dockerfile}
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
    interval: 2s
    timeout: 3s
    retries: 20
    start_period: 2s

services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: flights, POSTGRES_PASSWORD: flights, POSTGRES_DB: flights}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flights -d flights"]
      interval: 2s
      timeout: 3s
      retries: 30

  loader:                       # разовая загрузка рейсов, идемпотентна
    build: {context: ., dockerfile: generator/Dockerfile}
    environment: {DATABASE_URL: "postgresql+psycopg://flights:flights@db:5432/flights"}
    depends_on: {db: {condition: service_healthy}}
    restart: "no"

  provider1:
    <<: *provider
    environment: {PROVIDER_ID: "1", MEAN_DELAY_MS: "300", ERROR_RATE: "0.05", SLOW_RATE: "0"}
  provider2:
    <<: *provider
    environment: {PROVIDER_ID: "2", MEAN_DELAY_MS: "500", ERROR_RATE: "0.05", SLOW_RATE: "0"}
  provider3:
    <<: *provider
    environment: {PROVIDER_ID: "3", MEAN_DELAY_MS: "800", ERROR_RATE: "0.05", SLOW_RATE: "0.10"}

  search:
    build: {context: ., dockerfile: search/Dockerfile}
    environment:
      DATABASE_URL: "postgresql+psycopg://flights:flights@db:5432/flights"
      PROVIDER_URLS: "http://provider1:8000,http://provider2:8000,http://provider3:8000"
      APP_MODULE: ${APP_MODULE:-app.main:app}
    depends_on:
      db: {condition: service_healthy}
      loader: {condition: service_completed_successfully}
      provider1: {condition: service_healthy}
      provider2: {condition: service_healthy}
      provider3: {condition: service_healthy}
    cap_add: [SYS_PTRACE]       # py-spy использует ptrace
    volumes: ["./profiles:/profiles"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
